#
# mosaic_efpga_demo_floonoc.yaml — the wake demonstration on the FlooNoC bus with an eFPGA
# fabric: mosaic_floonoc.yaml plus `efpga`, as configs/mosaic_efpga_demo.yaml is
# for the OBI bus. Sweep step efpga_floonoc boots it with a user design
# (tb/mosaic_soc/run_fw.sh, EFPGA_DESIGN and EFPGA_TEST).

soc:
  name: mosaic_efpga_demo_floonoc
  pdk: gf180mcu

  cores:
    - ip: cv32e20         # TITAN — orchestrator; boots from the boot ROM (hart 0)
      isa: rv32emc
      count: 1
      role: titan

    - ip: fazyrv          # ATLAS worker (hart 1) — boots dormant, woken by the TDU
      isa: rv32i
      chunksize: 8
      count: 1
      role: atlas
      boot_addr: 0x1000   # reset PC in RAM — its own program

    - ip: serv            # NANO worker (hart 2) — boots dormant, woken by the TDU
      isa: rv32i
      count: 1
      role: nano
      boot_addr: 0x2000   # reset PC in RAM — its own program

  memory:
    sram_kb: 32
    boot_rom_kb: 2

  dma: idma

  bus: floonoc           # floogen AXI NoC + OBI<->AXI bridges
  bus_opts:
    floonoc:
      route_algo: ID     # compact topology is a single ID-table router
      endpoints: compact # nh+1 managers / 2 subordinates

  scheduler:
    tdu: true
    mode: dynamic

  peripherals:
    - uart
    - gpio
    - timer
    - spi

  efpga:
    preset: small
