#
# mosaic_efpga_fast.yaml — mosaic_efpga_demo.yaml at 32 MHz, the control of the
# timing of a user's design in the one-command flow (sweep step efpga_timed,
# docs/efpga.md): with the fabric's clock at one cycle in four it has 125 ns, and
# tb/efpga/task_count.v needs 134 ns at ss on the macro of efpga_netlist, so
# EFPGA_MACRO must refuse it. At
# 40 MHz the macro itself fails: its latest strobe, 24.6 ns, and the latch's hold
# do not fit in a cycle of the loader.

soc:
  name: mosaic_efpga_fast
  pdk: gf180mcu

  cores:
    - ip: cv32e20         # TITAN — orchestrator; boots from the boot ROM (hart 0)
      isa: rv32emc
      count: 1
      role: titan

    - ip: fazyrv          # ATLAS worker (hart 1) — boots dormant, woken by the TDU
      isa: rv32i
      chunksize: 8
      count: 1
      role: atlas
      boot_addr: 0x1000

    - ip: serv            # NANO worker (hart 2) — boots dormant, woken by the TDU
      isa: rv32i
      count: 1
      role: nano
      boot_addr: 0x2000

  memory:
    sram_kb: 32
    boot_rom_kb: 2

  dma: idma

  bus: obi

  scheduler:
    tdu: true
    mode: dynamic

  peripherals:
    - uart
    - gpio
    - timer
    - spi

  efpga:
    preset: small

  objectives:
    target_clock_mhz: 32
