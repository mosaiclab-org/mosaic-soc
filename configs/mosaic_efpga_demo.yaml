#
# mosaic_efpga_demo.yaml — the wake demonstration with an eFPGA fabric.
#
# The SoC of mosaic_wake_demo.yaml plus `efpga`: the generator puts the fabric
# of configs/efpga/small.csv in mosaic_soc, its registers at 0x200C0000 and its
# user window at 0x50000000 (docs/efpga.md). tb/mosaic_soc/run_efpga.sh runs
# firmware on hart 0 that loads it, uses it, unloads it and loads it again.

soc:
  name: mosaic_efpga_demo
  pdk: gf180mcu

  cores:
    - ip: cv32e20         # TITAN — orchestrator; boots from the boot ROM (hart 0)
      isa: rv32emc
      count: 1
      role: titan

    - ip: fazyrv          # ATLAS worker (hart 1) — boots dormant, woken by the TDU
      isa: rv32i
      chunksize: 8
      count: 1
      role: atlas
      boot_addr: 0x1000

    - ip: serv            # NANO worker (hart 2) — boots dormant, woken by the TDU
      isa: rv32i
      count: 1
      role: nano
      boot_addr: 0x2000

  memory:
    sram_kb: 32
    boot_rom_kb: 2

  dma: idma

  bus: obi

  scheduler:
    tdu: true
    mode: dynamic

  peripherals:
    - uart
    - gpio
    - timer
    - spi

  efpga:
    preset: small
