#
# mosaic_efpga_medium.yaml — configs/mosaic_efpga_demo.yaml with the 8x8 preset
# `medium` (384 LUT4, 16 pads) instead of `small`. Sweep step efpga_medium
# boots it with a user design (tb/mosaic_soc/run_fw.sh).

soc:
  name: mosaic_efpga_medium
  pdk: gf180mcu

  cores:
    - ip: cv32e20         # TITAN — orchestrator; boots from the boot ROM (hart 0)
      isa: rv32emc
      count: 1
      role: titan

    - ip: fazyrv          # ATLAS worker (hart 1) — boots dormant, woken by the TDU
      isa: rv32i
      chunksize: 8
      count: 1
      role: atlas
      boot_addr: 0x1000

    - ip: serv            # NANO worker (hart 2) — boots dormant, woken by the TDU
      isa: rv32i
      count: 1
      role: nano
      boot_addr: 0x2000

  memory:
    sram_kb: 32
    boot_rom_kb: 2

  dma: idma

  bus: obi

  scheduler:
    tdu: true
    mode: dynamic

  peripherals:
    - uart
    - gpio
    - timer
    - spi

  efpga:
    preset: medium
